model:
  backbone: clip_vitb16
  hidden_dim: 512
  temporal_layers: 2
  temporal_heads: 4
  temporal_window: 25
  temporal_max_positions: 1536
  temp_gate: false
  temp_gate_weight: 10.0
  temp_gate_init: 0.0
  num_soft_prompts: 32
  fusion_num_layers: 2
  fusion_heads: 8
  score_head_layers: 1
  score_head_kernel: 3
  bin_head_type: adaptive
  adaptive_fuse_alpha0: 0.25
  adaptive_fuse_scale: 10.0
  multiclass_temp: 0.2
  motion_dim: 384
  motion_init_std: 0.0
  motion_dropout: 0.0
kip:
  enabled: false
  pmg_only: false
  use_gate_shift: true
  use_lkin: true
  gate_signal: flow_norm
  on_raw_features: false
  folding_factor: 4
  d_flow: 256
  pmg_latent_dim: 128
  align_proj_dim: 128
loss:
  lambda_rec: 1.0
  lambda_align: 0.1
  gamma_kin: 0.2
  beta_cons: 0.5
  tau_align: 0.07
  mil_topk_pct: 5
  sup_mil_topk_pct: 4
  mul_mil_topk_pct: 16
  mul_weight: 1.0
  pseudo_sup_weight: 1.0
  pseudo_sup_mil_weight: 1.0
  cap_contrastive_weight: 1.0
  contrastive_neg_mining: n3
  contrastive_temp: 0.02
  use_yp_anchor: true
  dvs_anchor_mode: span
  bottomk_weight: 0.0
  bottomk_topk_pct: 16
  captions_from_definitions: false
  align_subsample: 0
  align_exclude_window: 0
dvs:
  theta: 1.0
  theta_ego: 1.0
  delta_m: 5
  delta_m_ego: 2
  syn_max_num_clips: 5
  knn_filler_ratio: 0.5
  motion_aware_knn_key: false
data:
  dataset: Nexar
  is_egocentric: false
  frame_stride: 8
  crop_size: 224
  max_vis_len: 512
  num_workers: 4
train:
  stage: 2
  learning_rate: 5.0e-05
  batch_size: 64
  num_epochs: 33
  warmup_steps: 20
  weight_decay: 0.01
  seed: 2024
  amp: true
  grad_accum_steps: 1
  device: auto
  stage0_warmup: false
  stage05_hntune: false
  motion_lr_mult: 1.0
v2:
  crn: none
  motion: vit_s_k710_dl_from_giant
v5:
  readout: none
  queries: 1
  keys: content
  smil_weight: 0.0
stp:
  sa2: false
  top_k: 12
  motion: raw
  text_prompt: released
  prefix_len: 8
  sa2v2: false
  patch_weight: 0.2
  branch_weight: 0.3
  motion_dropout: 0.3
  sv2_gate: false
  gate_lr_mult: 25.0
  sv2_proj: false
kim:
  enabled: false
  prototypes: false
  width: 128
  mil_weight: 1.0
  nkc_weight: 0.1
  nkc_temp: 0.1
  nkc_negatives: 16
  anchor_thresh: 0.5
  proto_momentum: 0.1
  warmup_steps: 219
